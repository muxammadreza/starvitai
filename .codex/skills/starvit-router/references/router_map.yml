    - $starvit-wf-frontend-add-table-tanstack-virtual
    - $starvit-wf-frontend-add-chart-recharts
    - $starvit-wf-frontend-add-rbac-guard
    mandatory_gates:
    - $starvit-wf-qa-accessibility-review
    - $starvit-wf-03-security-privacy-gate
